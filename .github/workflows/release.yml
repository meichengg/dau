name: Release package

# Builds the universal Release app and wraps it in a .pkg for /Applications.
# The package's postinstall clears the quarantine flag and launches the app, which then
# installs and enables the input method itself (DECISIONS.md D37) — no logout needed.
# Manual: Actions > Release package > Run workflow. Tag: git push origin v0.1.0.
# Automatic: the sync-upstream workflow calls this after every upstream merge.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (CFBundleShortVersionString)
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      # The App Group name is "<team>.com.codefastlabs.dau.shared" and the team is a property
      # of the certificate, not of the repo, so it is derived here rather than hard-coded
      # (scripts/release/team-id.sh). Xcode's TeamIdentifierPrefix is empty in an unsigned
      # build, which is why APP_GROUP_ID is passed explicitly below.
      - name: Prepare signing identity
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci-ci-ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci-ci-ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if [[ -n "${MACOS_CERT_P12:-}" ]]; then
            echo "mode=cert" >> "$GITHUB_OUTPUT"
            echo "identity=Apple Development" >> "$GITHUB_OUTPUT"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          else
            # No Apple certificate in this fork's secrets: mint a throwaway self-signed
            # identity with the team OU. A self-signed signature still reports
            # "TeamIdentifier=not set", so the App Group is rejected and sign-app.sh drops
            # the team entitlement; the app installs and runs. Gatekeeper already rejects
            # unnotarized builds either way.
            echo "mode=selfsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::No certificate secret: the app will install and run but the App Group (shared settings) is rejected. See scripts/release/README.md."
            echo "identity=Dau CI" >> "$GITHUB_OUTPUT"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
              -subj "/CN=Dau CI/OU=433PH64SVW/O=Dau/C=VN" \
              -addext "keyUsage=critical,digitalSignature" \
              -addext "extendedKeyUsage=critical,codeSigning" \
              -addext "basicConstraints=critical,CA:false" 2>/dev/null
            # macOS still expects the legacy PKCS#12 MAC/ciphers on import.
            openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -out "$RUNNER_TEMP/id.p12" -passout pass:ci 2>/dev/null \
              || openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
                   -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
                   -out "$RUNNER_TEMP/id.p12" -passout pass:ci 2>/dev/null
            security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P ci \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
            # A self-signed chain is not trusted by default; trust it for this keychain.
            sudo security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem" || true
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-ci-ci "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning

      # A self-signed identity has no team, and neither does its signature, so fall back to
      # the fork's team: the group name stays stable and sign-app.sh drops the team
      # entitlement later because the signature cannot carry one.
      - name: Resolve App Group
        id: group
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          team=$(scripts/release/team-id.sh "$IDENTITY")
          if [[ -z "$team" ]]; then
            team=433PH64SVW
            echo "::warning::The signature carries no team: using $team for the App Group name."
          fi
          echo "Signing team: $team"
          echo "group=$team.com.codefastlabs.dau.shared" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test engine
        run: swift test --package-path Packages/DauEngine

      - name: Build Release
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
          GROUP_ID: ${{ steps.group.outputs.group }}
        run: |
          xcodebuild -project Dau.xcodeproj -scheme Dau -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData.noindex \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            APP_GROUP_ID="$GROUP_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Sign app
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          GROUP_ID: ${{ steps.group.outputs.group }}
        run: scripts/release/sign-app.sh build/DerivedData.noindex/Build/Products/Release/Dau.app "$IDENTITY"

      - name: Verify build
        env:
          GROUP_ID: ${{ steps.group.outputs.group }}
        run: |
          APP="build/DerivedData.noindex/Build/Products/Release/Dau.app"
          IM="$APP/Contents/Library/Input Methods/DauInputMethod.app"
          lipo -archs "$APP/Contents/MacOS/Dau"
          lipo -archs "$IM/Contents/MacOS/DauInputMethod"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Unrendered $(PLACEHOLDER) in a signed entitlement is a bug, not a style issue.
          for e in "$APP" "$IM"; do
            codesign -d --entitlements - --xml "$e" 2>/dev/null > /tmp/ents.plist || true
            if grep -q '\$(' /tmp/ents.plist; then
              echo "unrendered placeholder in $e:"; grep -o '\$([A-Z_]*)' /tmp/ents.plist; exit 1
            fi
            if grep -q '<key>com.apple.security.application-groups' /tmp/ents.plist; then
              grep -q "$GROUP_ID" /tmp/ents.plist || { echo "App Group is not $GROUP_ID in $e"; exit 1; }
            fi
          done
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -o "$GROUP_ID" || true
          if codesign -d --entitlements - --xml "$IM" 2>/dev/null | grep -q com.apple.security.network; then
            echo "Input method has a network entitlement, contradicting N2"; exit 1
          fi
          if codesign -d --entitlements - --xml "$IM" 2>/dev/null | grep -q get-task-allow; then
            echo "Release build still carries get-task-allow"; exit 1
          fi

      - name: Package .pkg
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          export PKG_SIGN_IDENTITY="$IDENTITY"
          scripts/release/build-pkg.sh "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dau-${{ steps.v.outputs.version }}
          path: build/pkg/out/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/pkg/out/*.pkg
          generate_release_notes: true
