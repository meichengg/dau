name: Release package

# Builds the universal Release app and wraps it in a .pkg for /Applications.
# The package's postinstall clears the quarantine flag and launches the app, which then
# installs and enables the input method itself (DECISIONS.md D37) — no logout needed.
# Manual: Actions > Release package > Run workflow. Tag: git push origin v0.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (CFBundleShortVersionString)
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Prepare signing identity
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci-ci-ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci-ci-ci "$KEYCHAIN"
          if [[ -n "${MACOS_CERT_P12:-}" ]]; then
            echo "mode=cert" >> "$GITHUB_OUTPUT"
            echo "identity=Apple Development" >> "$GITHUB_OUTPUT"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          else
            # No Apple certificate in this fork's secrets: mint a throwaway self-signed
            # identity. Its OU carries the team ID so the App Group prefix still matches
            # and macOS keeps treating the app as team M58DANM3ZP. Gatekeeper already
            # rejects unnotarized builds either way.
            echo "mode=selfsigned" >> "$GITHUB_OUTPUT"
            echo "identity=Dau CI" >> "$GITHUB_OUTPUT"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
              -subj "/CN=Dau CI/OU=M58DANM3ZP/O=Dau/C=VN" \
              -addext "keyUsage=critical,digitalSignature" \
              -addext "extendedKeyUsage=critical,codeSigning" \
              -addext "basicConstraints=critical,CA:false" 2>/dev/null
            openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -out "$RUNNER_TEMP/id.p12" -passout pass:ci 2>/dev/null
            security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P ci \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
            # A self-signed chain is not trusted by default; trust it for this keychain.
            sudo security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string M58DANM3ZP" \
              Apps/Dau/Dau.entitlements
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string M58DANM3ZP" \
              Apps/DauInputMethod/DauInputMethod.entitlements
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-ci-ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test engine
        run: swift test --package-path Packages/DauEngine

      - name: Build Release
        env:
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
          IDENTITY: ${{ steps.sign.outputs.identity }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          ARGS=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IDENTITY" DEVELOPMENT_TEAM=M58DANM3ZP)
          xcodebuild -project Dau.xcodeproj -scheme Dau -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData.noindex \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${ARGS[@]}" build

      - name: Verify build
        run: |
          APP="build/DerivedData.noindex/Build/Products/Release/Dau.app"
          lipo -archs "$APP/Contents/MacOS/Dau"
          lipo -archs "$APP/Contents/Library/Input Methods/DauInputMethod.app/Contents/MacOS/DauInputMethod"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -o 'M58DANM3ZP[^<]*' || true
          codesign -d --entitlements - --xml "$APP/Contents/Library/Input Methods/DauInputMethod.app" 2>/dev/null | grep -o 'M58DANM3ZP[^<]*' || true
          if codesign -d --entitlements - --xml "$APP/Contents/Library/Input Methods/DauInputMethod.app" 2>/dev/null | grep -q com.apple.security.network; then
            echo "Input method has a network entitlement, contradicting N2"; exit 1
          fi
          if codesign -d --entitlements - --xml "$APP/Contents/Library/Input Methods/DauInputMethod.app" 2>/dev/null | grep -q get-task-allow; then
            echo "Release build still carries get-task-allow"; exit 1
          fi

      - name: Package .pkg
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          export PKG_SIGN_IDENTITY="$IDENTITY"
          scripts/release/build-pkg.sh "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dau-${{ steps.v.outputs.version }}
          path: build/pkg/out/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/pkg/out/*.pkg
          generate_release_notes: true