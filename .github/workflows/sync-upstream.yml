name: Sync upstream

# Keeps the fork level with codefastlabs/dau, then rebuilds the package. Two lists decide
# conflicts without a human: FORK_ONLY (the fork owns the file — ours wins) and
# UPSTREAM_BY_DESIGN (upstream rewrites the file constantly — theirs wins, that is the point
# of syncing). Any other conflict stops the run and opens one issue, with no merge commit and
# no push, so the branch never lands halfway.
on:
  schedule:
    - cron: "17 * * * *"      # hourly; the job exits in seconds when nothing moved
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/codefastlabs/dau.git
  BRANCH: main
  # Owned by the fork (upstream never has these paths).
  FORK_ONLY: "docs/history/LOG-FORK-CI.md .github/workflows/sync-upstream.yml"
  # Upstream's own running log; the fork logs CI in docs/history/LOG-FORK-CI.md instead.
  UPSTREAM_BY_DESIGN: "docs/PROGRESS.md"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A push made with this token does trigger the other workflow, so release.yml
          # runs on the new commit without a second token.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward check
        id: ff
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --prune upstream "+refs/heads/$BRANCH:refs/remotes/upstream/$BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [[ "$behind" == "0" ]]; then
            echo "Up to date, nothing to do."
          fi

      - name: Merge upstream
        if: steps.ff.outputs.behind != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          if git merge --no-ff --no-commit "upstream/$BRANCH"; then
            echo "merged clean"
            exit 0
          fi
          conflict=$(git diff --name-only --diff-filter=U)
          echo "conflict in: $conflict"
          for f in $conflict; do
            case " $FORK_ONLY " in
              *" $f "*) git checkout --ours -- "$f"; git add "$f"; echo "kept ours:   $f"; continue ;;
            esac
            case " $UPSTREAM_BY_DESIGN " in
              *" $f "*) git checkout --theirs -- "$f"; git add "$f"; echo "took theirs: $f"; continue ;;
            esac
            echo "other: $f"
          done
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "::warning::Upstream conflicts outside the resolved lists: $conflict"
          fi

      - name: Open issue on a real conflict
        if: steps.merge.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Sync upstream blocked: merge conflict"
          if gh issue list --search "in:title \"$title\"" --state open --json number \
               --jq '.[0].number' | grep -c . >/dev/null; then
            echo "An issue is already open."
            exit 0
          fi
          head=$(git log -1 --format='%h %s' "upstream/$BRANCH")
          gh issue create --title "$title" --assignee "${{ github.repository_owner }}" \
            --body "$(printf '%s\n' \
              "Merging \`codefastlabs/dau\` hit a conflict outside the resolved lists:" " " \
              '```' "$head" '```' " " \
              "Nothing was pushed. Merge by hand, then close this issue; the next run retries.")"

      - name: Commit and push
        if: steps.merge.outputs.blocked == 'false'
        id: push
        run: |
          if git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing staged (already merged)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Merge upstream codefastlabs/dau (auto sync)"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the release build
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "$BRANCH"
