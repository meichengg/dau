<!doctype html>

<head>

<title>Nhận diện – hướng biểu tượng</title>

<style>
body{margin:0}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#c7c7cc;margin:0;position:relative;flex:none;cursor:default}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--acc)}
.sw:checked::after{left:18px}
.pop{all:unset;box-sizing:border-box;height:26px;padding:0 10px 0 12px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 1px rgba(0,0,0,.06);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#1d1d1f;cursor:default;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;height:30px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);color:#1d1d1f;cursor:default;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:#b42318}
.seg{display:flex;padding:2px;border-radius:999px;background:rgba(0,0,0,.07);gap:2px}
.sg{all:unset;box-sizing:border-box;flex:1;height:26px;padding:0 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;justify-content:center;color:#1d1d1f;cursor:default;white-space:nowrap}
.sg.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;box-sizing:border-box;font-size:13px;color:#1d1d1f}
.sep{height:1px;background:rgba(0,0,0,.07);margin-left:16px}
.hint{font-size:12px;color:#6e6e73;line-height:1.4}
.sec{font-size:13px;font-weight:600;color:#1d1d1f;padding:0 4px}
.side{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:9px;font-size:13px;color:#1d1d1f;cursor:default;text-decoration:none}
.side.on{background:var(--acc);color:#fff;font-weight:500}
.tile{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 0 rgba(0,0,0,.12);font-size:12px;color:#1d1d1f}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;background:rgba(0,0,0,.06);color:#3a3a3c}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;height:26px;padding:0 10px;border-radius:7px;font-size:13px;color:#1d1d1f;cursor:default}
.mi.on{background:var(--acc);color:#fff}
.mk{width:14px;flex:none;display:inline-flex}
.k{margin-left:auto;color:#6e6e73;font-size:12px}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

</style>

<div style="width: 1200px; height: 533px; box-sizing: border-box; padding: 40px 48px; background: #FBFAF7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 28px; --acc: {{accent}}"><div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #1D1D1F; font-family: 'Be Vietnam Pro', -apple-system, 'Helvetica Neue', sans-serif">Biểu tượng: ba hướng</h1><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4a4a4f; max-width: 820px">Một chữ “ấ” mang hai dấu: dấu mũ và dấu sắc. Tách riêng dấu sắc sang màu son để biểu tượng tự kể tên sản phẩm. Phương án A được dùng cho toàn bộ mockup.</p></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px"><figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; border-radius: 24px; background: #fff; border: 2px solid #1D1D1F"><svg width="200" height="200" viewBox="0 0 100 100" aria-hidden="true"><rect x="0" y="0" width="100" height="100" rx="22.4" fill="#10285A"></rect><text x="48" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, 'Helvetica Neue', sans-serif" font-weight="700" font-size="64" fill="#F6F1E7">a</text><path d="M34 35 L47 25 L60 35" fill="none" stroke="#F6F1E7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M63 24 L73 13" fill="none" stroke="#E0533D" stroke-width="7.5" stroke-linecap="round"></path></svg><figcaption><div style="display: flex; flex-direction: column; gap: 2px; text-align: center"><span style="font-size: 13px; font-weight: 600; color: #1D1D1F">A. Mực và dấu son</span><span style="font-size: 12px; color: #5e5e63">Chữ ấ màu giấy trên nền mực; riêng dấu sắc màu son — chính là “dấu”</span></div></figcaption><span style="font-size: 12px; font-weight: 700; color: #fff; background: #1D1D1F; border-radius: 999px; padding: 3px 10px">Đề xuất</span></figure><figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; border-radius: 24px; background: #fff; border: 1px solid rgba(0,0,0,0.08)"><svg width="200" height="200" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.4" fill="#C8402A"></rect><rect x="18" y="18" width="64" height="64" rx="6" fill="none" stroke="#F6F1E7" stroke-width="3.5"></rect><text x="50" y="62" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, 'Helvetica Neue', sans-serif" font-weight="800" font-size="30" fill="#F6F1E7">Dấu</text></svg><figcaption><div style="display: flex; flex-direction: column; gap: 2px; text-align: center"><span style="font-size: 13px; font-weight: 600; color: #1D1D1F">B. Con dấu</span><span style="font-size: 12px; color: #5e5e63">“Dấu” còn nghĩa là con dấu. Đẹp nhưng chữ quá nhỏ ở cỡ 16–32px</span></div></figcaption></figure><figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; border-radius: 24px; background: #fff; border: 1px solid rgba(0,0,0,0.08)"><svg width="200" height="200" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.4" fill="#E9E6DF"></rect><rect x="14" y="12" width="72" height="70" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)"></rect><text x="48" y="70" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, 'Helvetica Neue', sans-serif" font-weight="700" font-size="46" fill="#1D1D1F">a</text><path d="M37 37 L47 29 L57 37" fill="none" stroke="#1D1D1F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M59 28 L68 18" fill="none" stroke="#E0533D" stroke-width="6" stroke-linecap="round"></path></svg><figcaption><div style="display: flex; flex-direction: column; gap: 2px; text-align: center"><span style="font-size: 13px; font-weight: 600; color: #1D1D1F">C. Phím gõ</span><span style="font-size: 12px; color: #5e5e63">Nắp phím mang chữ ấ. Dễ hiểu nhưng giống nhiều app bàn phím khác</span></div></figcaption></figure></div></div>
