<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trạng thái khi gõ trong ứng dụng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#c7c7cc;margin:0;position:relative;flex:none;cursor:default}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--acc)}
.sw:checked::after{left:18px}
.pop{all:unset;box-sizing:border-box;height:26px;padding:0 10px 0 12px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 1px rgba(0,0,0,.06);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#1d1d1f;cursor:default;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;height:30px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);color:#1d1d1f;cursor:default;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:#b42318}
.seg{display:flex;padding:2px;border-radius:999px;background:rgba(0,0,0,.07);gap:2px}
.sg{all:unset;box-sizing:border-box;flex:1;height:26px;padding:0 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;justify-content:center;color:#1d1d1f;cursor:default;white-space:nowrap}
.sg.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;box-sizing:border-box;font-size:13px;color:#1d1d1f}
.sep{height:1px;background:rgba(0,0,0,.07);margin-left:16px}
.hint{font-size:12px;color:#6e6e73;line-height:1.4}
.sec{font-size:13px;font-weight:600;color:#1d1d1f;padding:0 4px}
.side{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:9px;font-size:13px;color:#1d1d1f;cursor:default;text-decoration:none}
.side.on{background:var(--acc);color:#fff;font-weight:500}
.tile{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 0 rgba(0,0,0,.12);font-size:12px;color:#1d1d1f}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;background:rgba(0,0,0,.06);color:#3a3a3c}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;height:26px;padding:0 10px;border-radius:7px;font-size:13px;color:#1d1d1f;cursor:default}
.mi.on{background:var(--acc);color:#fff}
.mk{width:14px;flex:none;display:inline-flex}
.k{margin-left:auto;color:#6e6e73;font-size:12px}

</style>
</helmet>
<div style="width: 900px; height: 640px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; --acc: {{accent}}"><div aria-hidden="true" style="position: absolute; inset: 0; background: #1c2f4a; overflow: hidden">
<div style="position: absolute; width: 620px; height: 620px; border-radius: 50%; background: #2d6cb5; left: -160px; top: -220px"></div>
<div style="position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #e08a3c; right: -140px; bottom: -200px"></div>
<div style="position: absolute; width: 380px; height: 380px; border-radius: 50%; background: #6a4fa3; right: 120px; top: -120px"></div>
<div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #2f8f7a; left: 180px; bottom: -150px"></div>
</div>
<div style="position: absolute; inset: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px; align-content: center">
<figure style="margin: 0; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; background: rgba(246,246,249,0.80); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 24px 64px rgba(0,0,0,0.4)"><span style="font-size: 12px; color: #5e5e63">Safari</span><div style="font-size: 16px; color: #1d1d1f; min-height: 64px">Tôi đang gõ tiếng Việ<span style="display: inline-block; width: 2px; height: 18px; background: var(--acc); vertical-align: -3px"></span></div><figcaption style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08)"><span style="font-size: 13px; font-weight: 600; color: #1d1d1f">Không gạch chân (mặc định)</span><span style="font-size: 12px; color: #3a3a3c">Chữ được thay ngay tại chỗ, như gõ thẳng vào ứng dụng.</span></figcaption></figure>
<figure style="margin: 0; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; background: rgba(246,246,249,0.80); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 24px 64px rgba(0,0,0,0.4)"><span style="font-size: 12px; color: #5e5e63">Ứng dụng có quy tắc “Có gạch chân”</span><div style="font-size: 16px; color: #1d1d1f; min-height: 64px">xin <span style="text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px">chào</span><span style="display: inline-block; width: 2px; height: 18px; background: var(--acc); vertical-align: -3px"></span></div><figcaption style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08)"><span style="font-size: 13px; font-weight: 600; color: #1d1d1f">Có gạch chân (chế độ tương thích)</span><span style="font-size: 12px; color: #3a3a3c">Từ đang gõ được gạch chân, chốt khi nhấn Space.</span></figcaption></figure>
<figure style="margin: 0; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; background: rgba(246,246,249,0.80); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 24px 64px rgba(0,0,0,0.4)"><span style="font-size: 12px; color: #5e5e63">Terminal</span><div style="font-size: 16px; color: #1d1d1f; min-height: 64px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 14px">$ git status<span style="display: inline-block; width: 2px; height: 18px; background: var(--acc); vertical-align: -3px"></span></span><span style="display: block; margin: 4px 0 0 98px; width: max-content"><span style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 26px; border-radius: 13px; background: #0a84ff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); "><span style="color: #fff; font-size: 13px; font-weight: 700">A</span></span></span></div><figcaption style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08)"><span style="font-size: 13px; font-weight: 600; color: #1d1d1f">Gõ tiếng Anh bằng U.S.</span><span style="font-size: 12px; color: #3a3a3c">Chuyển sang U.S. (hoặc bàn phím tiếng Anh khác) bằng phím tắt chuyển nguồn đầu vào của macOS; chỉ báo “A” do macOS hiển thị (D2).</span></figcaption></figure>
<figure style="margin: 0; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; background: rgba(246,246,249,0.80); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 24px 64px rgba(0,0,0,0.4)"><span style="font-size: 12px; color: #5e5e63">Ghi chú</span><div style="font-size: 16px; color: #1d1d1f; min-height: 64px"><span style="color: #8e8e93">Hôm nay trời mat<span style="display: inline-block; width: 2px; height: 18px; background: var(--acc); vertical-align: -3px"></span></span><span style="display: block; font-size: 12px; color: #5e5e63; margin: 6px 0">gõ <b style="color: #1d1d1f">s</b></span>Hôm nay trời <b>mát</b><span style="display: inline-block; width: 2px; height: 18px; background: var(--acc); vertical-align: -3px"></span></div><figcaption style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08)"><span style="font-size: 13px; font-weight: 600; color: #1d1d1f">Thêm dấu cho từ đã gõ</span><span style="font-size: 12px; color: #3a3a3c">Đặt con trỏ ngay sau từ rồi gõ phím dấu.</span></figcaption></figure>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0A64D8","options":["#0A64D8","#7A3FD1","#C2410C","#1F7A4D"]},"$preview":{"width":900,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0A64D8' };
}
}
</script>
</body>
</html>
