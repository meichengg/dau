<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cửa sổ cập nhật</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
body{margin:0}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#c7c7cc;margin:0;position:relative;flex:none;cursor:default}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--acc)}
.sw:checked::after{left:18px}
.pop{all:unset;box-sizing:border-box;height:26px;padding:0 10px 0 12px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 1px rgba(0,0,0,.06);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#1d1d1f;cursor:default;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;height:30px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);color:#1d1d1f;cursor:default;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:#b42318}
.seg{display:flex;padding:2px;border-radius:999px;background:rgba(0,0,0,.07);gap:2px}
.sg{all:unset;box-sizing:border-box;flex:1;height:26px;padding:0 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;justify-content:center;color:#1d1d1f;cursor:default;white-space:nowrap}
.sg.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;box-sizing:border-box;font-size:13px;color:#1d1d1f}
.sep{height:1px;background:rgba(0,0,0,.07);margin-left:16px}
.hint{font-size:12px;color:#6e6e73;line-height:1.4}
.sec{font-size:13px;font-weight:600;color:#1d1d1f;padding:0 4px}
.side{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:9px;font-size:13px;color:#1d1d1f;cursor:default;text-decoration:none}
.side.on{background:var(--acc);color:#fff;font-weight:500}
.tile{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 0 rgba(0,0,0,.12);font-size:12px;color:#1d1d1f}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;background:rgba(0,0,0,.06);color:#3a3a3c}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;height:26px;padding:0 10px;border-radius:7px;font-size:13px;color:#1d1d1f;cursor:default}
.mi.on{background:var(--acc);color:#fff}
.mk{width:14px;flex:none;display:inline-flex}
.k{margin-left:auto;color:#6e6e73;font-size:12px}

</style>
</helmet>
<div style="width: 760px; height: 600px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; --acc: {{accent}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: #1c2f4a; overflow: hidden">
<div style="position: absolute; width: 620px; height: 620px; border-radius: 50%; background: #2d6cb5; left: -160px; top: -220px"></div>
<div style="position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #e08a3c; right: -140px; bottom: -200px"></div>
<div style="position: absolute; width: 380px; height: 380px; border-radius: 50%; background: #6a4fa3; right: 120px; top: -120px"></div>
<div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #2f8f7a; left: 180px; bottom: -150px"></div>
</div>
<div role="alertdialog" aria-labelledby="ut" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; box-sizing: border-box; padding: 24px 20px 18px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: rgba(246,246,249,0.80); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 24px 64px rgba(0,0,0,0.4)">
<svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><rect x="0" y="0" width="100" height="100" rx="22.4" fill="#10285A"></rect><text x="48" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, 'Helvetica Neue', sans-serif" font-weight="700" font-size="64" fill="#F6F1E7">a</text><path d="M34 35 L47 25 L60 35" fill="none" stroke="#F6F1E7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M63 24 L73 13" fill="none" stroke="#E0533D" stroke-width="7.5" stroke-linecap="round"></path></svg>
<h1 id="ut" style="margin: 6px 0 0; font-size: 15px; font-weight: 700; color: #1d1d1f">Đã có Dấu 1.1.0</h1>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #3a3a3c">Bạn đang dùng 1.0.0. Bản mới được cài lúc bạn không gõ và có thể quay về bản cũ nếu gặp lỗi.</p>
<div style="width: 100%; box-sizing: border-box; text-align: left; background: rgba(255,255,255,0.7); border-radius: 12px; padding: 12px 14px; font-size: 12px; color: #1d1d1f; display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Có gì mới</span>
<ul style="margin: 0; padding-left: 16px; line-height: 1.5"><li>Sửa lỗi mất chữ trong [tên ứng dụng]</li><li>Cập nhật danh sách ứng dụng tương thích</li></ul>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #1f6b45"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1f6b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>Đã xác minh chữ ký số của bản cập nhật</span>
<label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #1d1d1f; align-self: flex-start"><input type="checkbox" checked style="accent-color: var(--acc); margin: 0"> Tự động cài các bản sau</label>
<div style="width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
<button class="btn pri" style="width: 100%">Cài bản mới</button>
<button class="btn" style="width: 100%">Nhắc sau</button>
<button class="btn" style="width: 100%; background: transparent">Bỏ qua bản này</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0A64D8","options":["#0A64D8","#7A3FD1","#C2410C","#1F7A4D"]},"$preview":{"width":760,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0A64D8' };
}
}
</script>
</body>
</html>
