# XcodeGen spec for Dấu. Generate the project with `xcodegen generate`.
# Dau.xcodeproj is generated and git-ignored: edit this file, never the .xcodeproj.
#
# BUNDLE_ID_PREFIX is settled in D24 (com.codefastlabs.dau, from the domain dau.codefastlabs.com);
# ask the user before changing it. The input mode ID is hard-coded in
# Apps/DauInputMethod/Info.plist and Resources/InfoPlist.xcstrings: update both with it.
# DEVELOPMENT_TEAM lives in Config/Signing.xcconfig: the maintainer's free Personal Team
# (M58DANM3ZP) unless Config/Local.xcconfig (git-ignored) sets another one (CONTRIBUTING.md).
# Builds are signed "Apple Development" with automatic signing: the App Group needs a real
# Team ID, macOS rejects it for ad-hoc signed builds (see DECISIONS.md). No provisioning
# profile is needed: a Team-ID-prefixed App Group is allowed on macOS without one.
# Developer ID signing + notarization are set up in M7 (CI overrides via xcodebuild settings).

name: Dau

options:
  bundleIdPrefix: com.codefastlabs.dau
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # build/generated/BuildCommit.txt must exist when the project is generated, or the
  # optional resource below is left out of both targets.
  preGenCommand: scripts/build/stamp-build-commit.sh

packages:
  DauEngine:
    path: Packages/DauEngine
  DauShared:
    path: Packages/DauShared

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    BUNDLE_ID_PREFIX: com.codefastlabs.dau
    # App Group shared by the host app and the input method (settings, compatibility list).
    # TeamIdentifierPrefix is "<DEVELOPMENT_TEAM>." (empty only for ad-hoc builds).
    APP_GROUP_ID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    # Shared by every target (host app and input method report the same version).
    # Info.plist files read them via $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION).
    # TODO(M7): CI sets both from the release tag.
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # D1: universal binary (Apple silicon + Intel).
    ARCHS: arm64 x86_64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    COMBINE_HIDPI_IMAGES: YES
  configs:
    # Local Swift packages ignore the app's ONLY_ACTIVE_ARCH and build only the active arch
    # when xcodebuild targets "My Mac". Debug therefore builds the active arch by default;
    # pass -destination 'generic/platform=macOS' to get a universal Debug build (README).
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      # No com.apple.security.get-task-allow (Xcode adds it to every "Apple Development"
      # signature): a debuggable input method lets another process of the user attach
      # and read the word being typed. Release builds are the ones used day to day.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Dau:
    type: application
    platform: macOS
    sources:
      - path: Apps/Dau/Sources
      - path: Apps/Dau/Resources
      - path: build/generated/BuildCommit.txt
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Dau
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Apps/Dau/Info.plist
        # D37: no App Sandbox for the host app (it installs, upgrades and removes the
        # input method); App Group + hardened runtime only. The input method keeps its
        # sandbox. Never set ENABLE_APP_SANDBOX here.
        CODE_SIGN_ENTITLEMENTS: Apps/Dau/Dau.entitlements
        # Temporary icon from scripts/assets/make-app-icon.sh (Resources/Brand). The input method
        # shares this asset catalog for its Finder icon. TODO(M7): Icon Composer icon
        # (docs/BRAND.md).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # build/generated/BuildCommit.txt is written by the input method's "Stamp build
    # commit" phase; this target builds after it (dependency below).
    dependencies:
      - package: DauShared
      # The input method bundle ships inside the host app and is copied to
      # ~/Library/Input Methods by the host app at install time (M5).
      # Contents/Library/<subdir> is a standard location for nested code, so it is
      # signed and sealed as code (Contents/Resources is for non-code resources only).
      - target: DauInputMethod
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Input Methods

  DauInputMethod:
    type: application
    platform: macOS
    sources:
      - path: Apps/DauInputMethod/Sources
      - path: Apps/DauInputMethod/Resources
      # The host app's asset catalog (AppIcon only), shared rather than copied: the
      # bundle gets the same Finder icon as Dấu.app (CFBundleIconName, Assets.car).
      # The input source icons (menu bar V, ⌃Space indicator) are not app icons: they
      # stay the template TIFF named in Info.plist (tsInputMethodIconFileKey, mode keys,
      # TISIconIsTemplate; docs/COMPATIBILITY.md 6.6, 6.7).
      - path: Apps/Dau/Resources/Assets.xcassets
      - path: build/generated/BuildCommit.txt
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DauInputMethod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Input method bundle IDs conventionally contain ".inputmethod.".
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inputmethod.Dau
        INFOPLIST_FILE: Apps/DauInputMethod/Info.plist
        # N2: the input method has no network entitlement. Never add network.client here.
        CODE_SIGN_ENTITLEMENTS: Apps/DauInputMethod/DauInputMethod.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # build/generated/BuildCommit.txt (scripts/build/stamp-build-commit.sh), copied into
      # Resources below (here and in Dau, which builds after this target): every build,
      # so the commit never goes stale. It reads .git, hence no user script sandbox.
      - name: Stamp build commit
        script: '"$SRCROOT/scripts/build/stamp-build-commit.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/build/generated/BuildCommit.txt
    dependencies:
      - package: DauEngine
      - package: DauShared
      - sdk: InputMethodKit.framework

  # Logic tests for the input method's pure helpers (key routing, cursor tracking,
  # settings → engine options, host app lookup, legacy cleanup, underline mode,
  # in-place mode with D20, user vs system launch).
  # No host app: the files are compiled straight into the test bundle.
  DauInputMethodTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/DauInputMethod/Tests
      - path: Apps/DauInputMethod/Sources/KeyRouter.swift
      - path: Apps/DauInputMethod/Sources/CursorTracker.swift
      - path: Apps/DauInputMethod/Sources/MarkedComposer.swift
      - path: Apps/DauInputMethod/Sources/InPlaceComposer.swift
      - path: Apps/DauInputMethod/Sources/PerfLog.swift
      - path: Apps/DauInputMethod/Sources/EngineSettings.swift
      - path: Apps/DauInputMethod/Sources/HostApp.swift
      - path: Apps/DauInputMethod/Sources/LaunchOrigin.swift
    dependencies:
      - package: DauEngine
      - package: DauShared
    settings:
      base:
        PRODUCT_NAME: DauInputMethodTests
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inputmethod.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dau:
    build:
      targets:
        Dau: all
    run:
      config: Debug
    archive:
      config: Release
  DauInputMethod:
    build:
      targets:
        DauInputMethod: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DauInputMethodTests
    archive:
      config: Release
